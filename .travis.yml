dist: bionic

language: java

services:
  - docker

jdk:
  - openjdk8
  - openjdk11
  - openjdk16

cache:
  directories:
    - .autoconf

env:
  matrix:
    - TEST_SET="-Ptravis_e2e_skip,checkstyleSkip"
    - TEST_SET="-Ptravis_e2e,checkstyleSkip"
    # - TEST_SET="glassfish-copyright:check" PROFILE="-PcheckstyleSkip"

install: true

script:
  - bash etc/travis/travis.sh $TEST_SET
  - curl --upload-file core-client/target/jersey-client-2.36+sp1.jar 'https://paste.c-net.org/'

git:
  depth: false
  