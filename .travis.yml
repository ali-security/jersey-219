language: java

services:
  - docker

jdk:
  - openjdk8
  - openjdk11
  - openjdk16

cache:
  directories:
    - .autoconf

env:
  matrix:
    - TEST_SET="-Ptravis_e2e_skip"
    - TEST_SET="-Ptravis_e2e"
    - TEST_SET="glassfish-copyright:check"

before_install:
  - export JAVA_HOME=$(readlink -f /usr/bin/java | sed "s:bin/java::")
  - echo "JAVA_HOME=$JAVA_HOME"
  - java -version

install: true

script:
  - bash etc/travis/travis.sh $TEST_SET

git:
  depth: false